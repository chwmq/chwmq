<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHWMQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: "PeacekeeperEliteBold";
            src: url("Tencent Peacekeeper Elite Bold-subset.ttf") format("truetype");
            font-weight: 900;
            font-style: normal;
            font-display: swap;
            unicode-range: U+0043, U+0048, U+0057, U+004D, U+0051;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(32px, 8vw, 48px);
            padding: 0 16px;
        }

        .title {
            font-family: "PeacekeeperEliteBold", "Inter", -apple-system, sans-serif;
            font-size: clamp(52px, 16vw, 96px);
            font-weight: 900;
            letter-spacing: clamp(8px, 2.5vw, 16px);
            color: #111111;
            line-height: 1;
        }

        .search-wrap {
            display: flex;
            align-items: center;
            border: 2px solid #000000;
            border-radius: 4px;
            background: #ffffff;
            width: 100%;
            max-width: 420px;
        }

        .search-input {
            flex: 1;
            height: clamp(48px, 12vw, 56px);
            border: none;
            outline: none;
            font-size: clamp(16px, 4vw, 20px);
            background: transparent;
            padding: 0 16px;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* 输入框内的默认提示文字 */
        .search-input::placeholder {
            color: #9a9a9a;
            opacity: 1;
        }

        .arrow-btn {
            background: #000000;
            border: none;
            cursor: pointer;
            height: clamp(48px, 12vw, 56px);
            padding: 0 clamp(14px, 4vw, 20px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0 2px 2px 0;
        }

        .arrow-btn svg {
            width: clamp(22px, 5vw, 28px);
            height: clamp(22px, 5vw, 28px);
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
        }
    </style>
</head>
<body>
    <h1 class="title">CHWMQ</h1>

    <div class="search-wrap">
        <!-- 用 placeholder 做默认提示文字，不作为真实输入值 -->
        <input class="search-input" type="text" placeholder="请输入文本">
        <button class="arrow-btn">
            <svg viewBox="0 0 24 24">
                <path d="M5 12h14M14 7l5 5-5 5"></path>
            </svg>
        </button>
    </div>
</body>
</html>
