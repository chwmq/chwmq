<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHWMQ</title>
    <style>
        @font-face {
            font-family: "PeacekeeperEliteBold";
            src: url('Tencent Peacekeeper Elite Bold.ttf') format("truetype");
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 36px;
        }
        .title {
            font-family: "PeacekeeperEliteBold", sans-serif;
            font-size: 88px;
            font-weight: 900;
            letter-spacing: 14px;
            color: #111111;
        }
        .search-wrap {
            display: flex;
            align-items: center;
            border: 2px solid #000000;
            border-radius: 4px;
        }
        .search-input {
            width: 320px;
            height: 52px;
            border: none;
            outline: none;
            font-size: 18px;
            background: transparent;
            padding: 0 12px;
        }
        .arrow-btn {
            background: #000000;
            border: none;
            cursor: pointer;
            height: 52px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            border-radius: 0 2px 2px 0;
        }
        .arrow-btn svg {
            width: 26px;
            height: 26px;
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
        }
    </style>
</head>
<body>
    <div class="title">CHWMQ</div>
    <div class="search-wrap">
        <input class="search-input" type="text" placeholder="">
        <button class="arrow-btn">
            <svg viewBox="0 0 24 24">
                <path d="M5 12h14M14 7l5 5-5 5"></path>
            </svg>
        </button>
    </div>
    <script>
        const input = document.querySelector('.search-input');
        const btn = document.querySelector('.arrow-btn');

        function submit() {
            const val = input.value.trim();
            if(val) {
                alert(`输入内容：${val}`);
            }
        }
        btn.addEventListener('click', submit);
        input.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') submit();
        })
    </script>
</body>
</html>
