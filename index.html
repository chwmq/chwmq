<form action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="这里填你在web3forms拿到的真实key">
  <input type="hidden" name="redirect" value="https://你的域名/success.html">

  <input type="text" name="name" placeholder="你的昵称" required>
  <input type="email" name="email" placeholder="邮箱（接收回复）" required>
  <textarea name="message" placeholder="写下你的反馈" required></textarea>

  <!-- 人机验证 -->
  <div class="h-captcha" data-captcha="true"></div>

  <button type="submit">提交反馈</button>
</form>
<script src="https://web3forms.com/client/script.js" async defer></script>
