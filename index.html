<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* 表单容器，居中 */
.comment-form-wrap {
  max-width: 520px;
  margin: 30px auto;
  padding: 24px;
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  font-family: system-ui, -apple-system, sans-serif;
}
.comment-form-wrap h3 {
  margin-top: 0;
  color: #222;
  font-weight: 600;
}
/* 输入框通用样式 */
.form-item {
  margin-bottom: 16px;
}
.form-item input,
.form-item textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  transition: 0.2s border;
  outline: none;
}
.form-item input:focus,
.form-item textarea:focus {
  border-color: #4080ff;
}
.form-item textarea {
  min-height: 140px;
  resize: vertical;
}
/* 提交按钮 */
.submit-btn {
  width: 100%;
  padding: 13px;
  background-color: #4080ff;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}
.submit-btn:hover {
  background-color: #2b6ed9;
}
</style>
</head>
<body>

<div class="comment-form-wrap">
  <h3>留言反馈</h3>
  <form action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="fbb1a5dc-02f5-4c5f-80b5-9ebe647af0d8">
    <!-- 蜜罐防机器人，用户看不见 -->
    <input type="checkbox" name="botcheck" style="display:none;">

    <div class="form-item">
      <input type="text" name="name" placeholder="你的昵称" required>
    </div>
    <div class="form-item">
      <textarea name="message" placeholder="写下你的留言……" required></textarea>
    </div>

    <button class="submit-btn" type="submit">提交留言</button>
  </form>
</div>

</body>
</html>
