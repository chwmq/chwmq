<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
.form-wrap {
  max-width: 520px;
  margin: 30px auto;
  padding: 24px;
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  font-family: system-ui, -apple-system, sans-serif;
}
.form-wrap h3 {
  margin-top: 0;
  color: #222;
  font-weight: 600;
}
.form-item {
  margin-bottom: 16px;
}
.form-item textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  transition: 0.2s border;
  outline: none;
  min-height: 140px;
  resize: vertical;
}
.form-item textarea:focus {
  border-color: #4080ff;
}
.submit-btn {
  width: 100%;
  padding: 13px;
  background-color: #4080ff;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}
.submit-btn:hover {
  background-color: #2b6ed9;
}
.submit-btn:disabled {
  background-color:#88b8f5;
  cursor:not-allowed;
}
.tip {
  color:#666;
  font-size:13px;
  margin:8px 0 16px;
}
</style>
</head>
<body>

<div class="form-wrap">
  <h3>留言提交</h3>
  <div class="tip">系统将自动收集公网IP、浏览器设备信息，提交后等待管理员查看</div>
  <form id="msgForm">
    <!-- 这里填你web3forms的access_key -->
    <input type="hidden" name="access_key" value="fbb1a5dc-02f5-4c5f-80b5-9ebe647af0d8">
    <!-- 蜜罐字段，机器人会自动填充，web3forms识别为垃圾信息 -->
    <input type="text" name="botcheck" class="botcheck-hp">
    <input type="hidden" name="ip" id="ipInput">
    <input type="hidden" name="device" id="deviceInput">

    <div class="form-item">
      <textarea name="message" placeholder="写下你的留言……" required></textarea>
    </div>

    <button class="submit-btn" type="submit">提交留言</button>
  </form>
</div>

<script>
// 国内优先IP接口 + 备用列表
const ipApiList = [
  "https://ipv4.ddnsip.cn/json",
  "https://api.ipify.org?format=json",
  "https://ipapi.co/json/"
];
let finalIp = "获取失败";

async function getPublicIP() {
  for(const api of ipApiList) {
    try {
      const res = await fetch(api, {signal:AbortSignal.timeout(4000)});
      if(!res.ok) continue;
      const json = await res.json();
      if(json.ip) return json.ip;
    } catch(e){continue;}
  }
  return "获取失败";
}

// 预加载IP
getPublicIP().then(ip=>{
  finalIp = ip;
  document.getElementById('ipInput').value = ip;
});
// 浏览器UA
document.getElementById('deviceInput').value = navigator.userAgent;

// AJAX提交
const form = document.querySelector('#msgForm');
form.addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(form);
  const btn = form.querySelector('.submit-btn');
  btn.disabled = true;
  btn.innerText = "提交中...";
  try{
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: formData
    });
    const result = await res.json();
    if(result.success) {
      alert("✅ 验证通过！留言提交成功，等待管理员查看");
      form.reset();
    } else {
      alert("❌ 提交失败：" + result.message);
    }
  }catch(err){
    alert("❌ 网络错误，请稍后重试");
  }
  btn.disabled = false;
  btn.innerText = "提交留言";
})
</script>
</body>
</html>
