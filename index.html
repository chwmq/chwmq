<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 允许用户双指缩放，不再锁死缩放比例 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CHWMQ</title>
    <style>
        @font-face {
            font-family: "PeacekeeperEliteBold";
            src: url("Tencent Peacekeeper Elite Bold-subset.ttf") format("truetype");
            font-weight: 900;
            font-style: normal;
            font-display: swap;
            unicode-range: U+0043, U+0048, U+0057, U+004D, U+0051;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;

            min-height: 100vh;
            min-height: 100svh;   /* 移动端浏览器地址栏收起/展开时高度自适应 */

            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(20px, 5vw, 48px) clamp(12px, 4vw, 24px);
        }

        /* 用 margin:auto 居中：内容超高时也能从顶部开始滚动，不会被裁掉 */
        .page {
            width: 100%;
            max-width: 560px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(22px, 6vw, 44px);
        }

        .title {
            font-family: "PeacekeeperEliteBold", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(36px, 11vw, 88px);
            font-weight: 900;
            letter-spacing: clamp(4px, 1.6vw, 14px);
            /* 抵消最后一个字母后面的字距，让标题视觉居中 */
            padding-left: clamp(4px, 1.6vw, 14px);
            color: #111111;
            line-height: 1;
            text-align: center;
            max-width: 100%;
        }

        .search-block {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-wrap {
            display: flex;
            align-items: center;
            border: 2px solid #000000;
            border-radius: 4px;
            background: #ffffff;
            width: 100%;
            max-width: 100%;
        }

        .search-input {
            flex: 1;
            min-width: 0;          /* 防止长内容把按钮挤出容器 */
            height: clamp(44px, 11vw, 56px);
            border: none;
            outline: none;
            font-size: clamp(16px, 4vw, 20px);
            background: transparent;
            padding: 0 16px;
            font-family: inherit;
        }

        /* 输入框内的默认提示文字 */
        .search-input::placeholder {
            color: #9a9a9a;
            opacity: 1;
        }

        /* 即将打开的文件名提示 */
        .file-hint {
            width: 100%;
            min-height: 18px;
            font-size: 13px;
            line-height: 1.4;
            color: #8a8a8a;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .arrow-btn {
            flex: none;            /* 按钮不参与压缩，始终完整可见 */
            background: #000000;
            border: none;
            cursor: pointer;
            height: clamp(44px, 11vw, 56px);
            padding: 0 clamp(12px, 4vw, 20px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0 2px 2px 0;
        }

        .arrow-btn svg {
            width: clamp(20px, 5vw, 28px);
            height: clamp(20px, 5vw, 28px);
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
        }

        /* 横屏手机 / 矮屏幕：整体再收一档，保证一屏放下 */
        @media (max-height: 520px) {
            .page {
                gap: 16px;
            }
            .title {
                font-size: clamp(28px, 8vw, 44px);
                letter-spacing: clamp(3px, 1vw, 8px);
                padding-left: clamp(3px, 1vw, 8px);
            }
            .search-input {
                height: 42px;
                font-size: 15px;
            }
            .arrow-btn {
                height: 42px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <h1 class="title">CHWMQ</h1>

        <div class="search-block">
            <div class="search-wrap">
                <!-- 用 placeholder 做默认提示文字，不作为真实输入值 -->
                <input class="search-input" id="searchInput" type="text" placeholder=":("
                       autocomplete="off" spellcheck="false">
                <button class="arrow-btn" id="searchBtn" type="button" title="打开文件" aria-label="打开文件">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 12h14M14 7l5 5-5 5"></path>
                    </svg>
                </button>
            </div>

            <!-- 显示将要打开的文件名，方便确认拼接结果 -->
            <div class="file-hint" id="fileHint"></div>
        </div>
    </main>

<script>
const input = document.querySelector('#searchInput');
const btn = document.querySelector('#searchBtn');
const hint = document.querySelector('#fileHint');

// 把输入的文本拼成目标文件名：文本 + .html
function buildFileName(raw) {
    let name = (raw || '').trim().replace(/\\/g, '/');
    name = name.replace(/^\.\//, '').replace(/^\/+/, '').replace(/\/+$/, '');
    if (!name) return '';
    // 已经带了 .html/.HTML 就不再重复追加
    if (!/\.html?$/i.test(name)) name += '.html';
    return name;
}

// 打开同目录下的该文件
function openTarget() {
    const fileName = buildFileName(input.value);
    if (!fileName) {
        input.focus();
        return;
    }
    // 相对路径：相对于当前页面所在目录
    window.open('./' + fileName, '_blank', 'noopener');
}

function refreshHint() {
    const fileName = buildFileName(input.value);
    hint.textContent = fileName ? '@' + fileName : '';
}

btn.addEventListener('click', openTarget);

input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        openTarget();
    }
});

input.addEventListener('input', refreshHint);
</script>
</body>
</html>
